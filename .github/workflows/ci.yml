name: ci

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한. 검증만 하고 아무것도 쓰지 않는다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 린트
        run: ruff check .
      - name: 타입 체크
        run: mypy
      - name: 테스트
        run: pytest -q

  # MCP 서버는 남의 npm 패키지다 (SPEC N14). 버전을 고정해 두었어도 레지스트리·Node에서
  # 실제로 뜨는지는 띄워 봐야 안다. 키가 없는 서버는 건너뛴다 — 실패가 아니라 "그 층은 없다"(D15).
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 포크 PR에는 Secrets가 없다. 그때는 이 잡을 건너뛴다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # korean-dart-mcp는 Node 20.19+를 요구한다 (package.json engines)
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - name: npx 캐시
        uses: actions/cache@v4
        with:
          # npx가 받은 패키지와 korean-dart-mcp의 corp 코드 SQLite(11.6만 건, 24h TTL).
          # 캐시가 없으면 매 실행이 콜드스타트라 기동에 10초대가 걸린다 (2026-08-29 실측).
          path: |
            ~/.npm/_npx
            ~/.korean-dart-mcp
          key: mcp-${{ runner.os }}-node20-${{ hashFiles('briefing/mcpc.py') }}
          restore-keys: mcp-${{ runner.os }}-node20-
      - run: pip install -r requirements.txt
      - name: MCP 기동·도구 확인 (기동 시간 기록)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        # --require dart: 공시 서버가 안 뜨면 실패시킨다(폴백이 있어도 CI에서는 알아야 한다).
        # naver는 키가 없으면 건너뛴다 — 그 층이 없는 것뿐이다.
        run: python scripts/mcp_probe.py --tools --require dart
