name: ci

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한. 검증만 하고 아무것도 쓰지 않는다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 린트
        run: ruff check .
      - name: 타입 체크
        run: mypy
      - name: 테스트
        run: pytest -q
